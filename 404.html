<!doctype html>
<html lang="fr">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zeoxone-theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0e13">
  <title data-title-fr="Page introuvable — ZeoxOne" data-title-en="Page not found — ZeoxOne">Page introuvable — ZeoxOne</title>
  <link rel="icon" href="/ZeoxOne/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ZeoxOne/styles.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/ZeoxOne/"><img src="/ZeoxOne/assets/favicon.svg" alt="Logo ZeoxOne" class="site-logo" width="34" height="34"><span>ZeoxOne<span class="brand-dot">.</span></span></a><div class="header-actions"><button type="button" class="theme-switch" data-theme-toggle aria-label="Activer le thème clair"><span aria-hidden="true">☼</span><span class="theme-switch-label">Clair</span></button></div></header>
  <main class="wrap" style="max-width:800px;padding:90px 0;text-align:left">
    <div class="eyebrow"><span class="eyebrow-line"></span>ERREUR 404</div>
    <h1 data-locale-html-fr="Cette page n'existe pas<span>.</span>" data-locale-html-en="This page could not be found<span>.</span>">Cette page n'existe pas<span>.</span></h1>
    <p class="hero-intro">Le lien est peut-être erroné ou la page a été déplacée. Reviens à l'accueil pour retrouver nos guides.</p>
    <a class="button button-primary" href="/ZeoxOne/">Retour à l'accueil <span>↗</span></a>
  </main>
<script>
(function(){const r=document.documentElement,k='zeoxone-theme';let t='dark';try{t=localStorage.getItem(k)==='light'?'light':'dark'}catch(e){}r.dataset.theme=t;r.style.colorScheme=t;function paint(){document.querySelectorAll('[data-theme-toggle]').forEach(b=>{const l=r.dataset.theme==='light';b.setAttribute('aria-label',l?'Activer le thème sombre':'Activer le thème clair');b.setAttribute('aria-pressed',String(l));const i=b.querySelector('span:first-child'),s=b.querySelector('.theme-switch-label');if(i)i.textContent=l?'◐':'☼';if(s)s.textContent=l?'Sombre':'Clair'})}document.addEventListener('click',e=>{if(!e.target.closest('[data-theme-toggle]'))return;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';r.style.colorScheme=r.dataset.theme;try{localStorage.setItem(k,r.dataset.theme)}catch(e){}paint()});paint()})();
</script>
  <script src="script.js"></script>
</body>
</html>
