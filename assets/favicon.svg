      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>

    <linearGradient id="zTopGrad" x1="20%" y1="30%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#eef3f8" />
      <stop offset="100%" stop-color="#b9c6d6" />
    </linearGradient>

    <linearGradient id="zBotGrad" x1="30%" y1="75%" x2="85%" y2="55%">
