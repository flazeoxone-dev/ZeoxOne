name: Contrôle qualité ZeoxOne

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Vérifications avant publication
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Python et Node.js
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier la syntaxe Python des outils de publication
        run: python -m py_compile .github/scripts/validate_site.py .github/scripts/generate_locales.py
      - name: Vérifier le JavaScript
        run: node --check script.js
      - name: Vérifier JSON, XML, HTML et liens internes
        run: python .github/scripts/validate_site.py
